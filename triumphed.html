<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TriumphED</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--navy:#0b1f3f;--bg:#f4f7fb;--card:#fff;--ink:#0f2038;--mut:#5b6b82;--line:#e0e8f2;--acc:#14b3d8;--teal:#0f9d8a;--warn:#c97a12;--bad:#d03f4b;--sh:0 6px 20px rgba(11,31,63,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09131f;--card:#11203a;--ink:#e8eef8;--mut:#9fb0c8;--line:#223455;--sh:0 6px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#09131f;--card:#11203a;--ink:#e8eef8;--mut:#9fb0c8;--line:#223455;--sh:0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100%}
aside{width:230px;background:var(--navy);color:#dbe7f7;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside h1{font:700 21px Georgia,serif;margin:0 8px 14px;color:#fff}aside h1 small{display:block;font:12px "Segoe UI",sans-serif;color:#7fd6ea;margin-top:2px}
.nv{background:none;border:0;text-align:left;color:#cfe0f5;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.2s}.nv:hover{background:#17335f}.nv.on{background:var(--acc);color:#04202b;font-weight:600}.nv small{display:block;font-size:11px;opacity:.7}
main{flex:1;min-width:0;padding:20px 24px 90px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}header h2{margin:0;font:700 24px Georgia,serif;flex:1}
.demo{background:#fff4d6;color:#7a5200;border-radius:8px;padding:6px 12px;font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);transition:transform .2s}.card.k{cursor:pointer}.card.k:hover{transform:translateY(-3px)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.big{font:700 30px Georgia,serif}.mut{color:var(--mut);font-size:13px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;transition:.2s}.btn:hover{background:#17335f}.btn.a{background:var(--acc);color:#04202b;font-weight:600}.btn.s{padding:5px 10px;font-size:13px}.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.pill{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}.pill.ok{background:#d6f4ee;color:#07705f}.pill.warn{background:#fdeccc;color:#8a5200}.pill.bad{background:#fbdadd;color:#9b2330}.pill.acc{background:#d3f1fa;color:#0a6179}.pill.mut{background:#e6ebf2;color:#44546b}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--teal));animation:grow 1s ease}
@keyframes grow{from{width:0}}@keyframes ring{from{stroke-dashoffset:440}}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}tr.k{cursor:pointer}tr.k:hover{background:var(--bg)}
.wrap{overflow-x:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.row>.f{flex:1;min-width:150px}
#modal{position:fixed;inset:0;background:rgba(5,15,35,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}#modal.on{display:flex}#modal>div{background:var(--card);border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:30}
.login{max-width:760px;margin:6vh auto;padding:20px;text-align:center}.login h1{font:700 40px Georgia,serif;margin:0}.login .g{margin-top:24px;text-align:left}
.step{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.step span{padding:6px 12px;border-radius:99px;background:var(--line);font-size:13px}.step span.d{background:var(--teal);color:#fff}.step span.c{background:var(--acc);color:#04202b;font-weight:700}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:40;animation:fall 1.8s ease-in forwards}
@media(max-width:800px){#app{flex-direction:column}aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;z-index:10;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}aside h1,.nv small{display:none}.nv{white-space:nowrap;padding:10px 12px}main{padding:14px 12px 96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="modal" role="dialog" aria-modal="true"></div><div id="toast" role="status"></div>
<script>
const T='30 Oct 2026',$=s=>document.querySelector(s);
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PROG=['Full Stack Web Development','Data Analytics','Digital Marketing'];
const COH=[{n:'FSWD · Jan 2026',p:0},{n:'Analytics · Feb 2026',p:1},{n:'Marketing · Mar 2026',p:2},{n:'FSWD · May 2026',p:0},{n:'Analytics · Jun 2026',p:1},{n:'Marketing · Jul 2026',p:2}];
const MEN=['Ms. Rina Kalita','Mr. Sanjay Bora','Dr. Leena Hazarika','Mr. Pranjal Deka','Ms. Jyoti Sarma'];
const MODS=['HTML & CSS Foundations','Responsive Design','JavaScript Basics','DOM & Events','Git & Collaboration','Async JavaScript','React Fundamentals','State & Hooks','Node.js & Express','REST APIs','Databases & SQL','Authentication & Security','Testing','Deployment & CI','System Design Basics','Capstone Project'];
const OUT=['Employed — relevant field','Employed — unrelated field','Further education','Seeking employment','Not seeking employment','Outcome unknown'],VER=['Verified','Self-reported','Pending verification','Unknown'];
const CS=['Preparing for opportunities','Actively seeking','Interviewing','Employed','Further learning','Not currently seeking'];
const NAV={student:[['dash','Home','PULSE'],['learn','My Learning','PULSE'],['support','Support','RECOVER'],['recover','Recovery Hub','RECOVER'],['career','Career Journey','PROVE']],admin:[['cmd','Command Centre','ALIGN'],['students','Students','PULSE'],['cases','Interventions','RECOVER'],['rec','Recovery','RECOVER'],['ledger','Accountability Ledger','PROVE']],mentor:[['cases','My Tasks','RECOVER'],['students','My Students','PULSE'],['rec','Pause Requests','RECOVER']],placement:[['out','Career Outcomes','PROVE']]};
const ROLES=[['student','Demo Student','Aarav Das · Full Stack Web Development'],['admin','Demo Academy Administrator','NorthEast Professional Academy'],['mentor','Demo Mentor','Ms. Rina Kalita'],['placement','Demo Placement Coordinator','Mr. Dhruv Medhi']];
function init(){let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(rnd()*a.length)];
const FN=['Diya','Rohan','Priya','Kabir','Ananya','Ishaan','Meera','Arjun','Riya','Dev','Tara','Neel','Sana','Vikram','Pooja','Rahul','Nisha','Aditya','Kavya'],LN=['Borah','Sharma','Gogoi','Saikia','Hazarika','Roy','Dutta','Baruah','Choudhury','Kalita','Nath'];
const S=[];for(let i=0;i<240;i++){const d=Math.floor(i/6)<7;S.push({id:'S-'+(1002+i),name:pick(FN)+' '+pick(LN),coh:i%6,mentor:i%5,prog:d?100:20+Math.floor(rnd()*75),att:55+Math.floor(rnd()*43),status:d?'Completed':(i%29===3?'Paused':'Active'),comp:[]})}
Object.assign(S[48],{id:'S-1001',name:'Aarav Das',mentor:0,prog:68,att:84,status:'Active',comp:[{n:'HTML, CSS & responsive layout',v:'Verified'},{n:'JavaScript fundamentals',v:'Verified'}]});
const RS=['Repeated absence','Multiple pending assignments','Missed learning milestone','Low assessment progress'],ST=['New','Under review','Support initiated','Follow-up required'],cases=[];let n=0;
for(const x of S){if(x.status==='Active'&&x.att<72&&x.id!=='S-1001'&&n<16){cases.push({id:'C-'+(100+n),sid:x.id,reason:pick(RS),pri:pick(['High','Medium','Low']),mentor:x.mentor,status:n>=14?'Resolved':ST[n%4],notes:[],fu:''});n++}}
const pz=S.filter(x=>x.status==='Paused').slice(0,2),pauses=pz.map((x,i)=>({id:'P-'+(i+1),sid:x.id,reason:i?'Family health emergency':'Lost income, need to take on extra work',date:'27 Oct 2026',status:'Pending',resume:'',why:''}));
const outs={};S.filter(x=>x.status==='Completed').forEach(x=>outs[x.id]={o:pick(OUT),v:pick(VER),cv:pick(VER),rv:pick(VER),emp:'',fu:''});
return{S,cases,pauses,plans:{},reqs:[],outs,mods:MODS.map((_,i)=>i<11),asg:8,cs:CS[0],proj:[{n:'Portfolio website',d:'React + Tailwind, deployed'}],cn:100+n,
notif:[{to:'student',t:'Mentor session with Ms. Rina Kalita on 3 Nov'},{to:'admin',t:'2 pause requests await review'},{to:'mentor',t:'Cases assigned to you need follow-up'},{to:'placement',t:'42 completed learners need outcome follow-up'}],audit:[{t:'Cohort “FSWD · Jan 2026” milestone review held',d:'28 Oct 2026'}]}}
let DB;try{DB=JSON.parse(localStorage.getItem('triumphed-v1'))}catch(e){}if(!DB)DB=init();
let role=null,view='',bell=false,UI={q:'',prog:'-1',sort:'name',st:'all',pf:'-1',cf:'all'};
const save=()=>{try{localStorage.setItem('triumphed-v1',JSON.stringify(DB))}catch(e){}};
const me=()=>DB.S.find(x=>x.id==='S-1001'),sid=id=>DB.S.find(x=>x.id===id),notify=(to,t)=>DB.notif.unshift({to,t}),log=t=>DB.audit.unshift({t,d:T});
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)};
function confetti(){for(let i=0;i<46;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=['#14b3d8','#0f9d8a','#0b1f3f','#7fd6ea'][i%4];e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}}
const modal=(t,h)=>{$('#modal').innerHTML=`<div><div class="row"><h3 class="f" style="margin:0;font-family:Georgia,serif">${t}</h3><button class="btn o s" onclick="closeM()" aria-label="Close">Close</button></div>${h}</div>`;$('#modal').classList.add('on')};
const closeM=()=>$('#modal').classList.remove('on');
const pill=t=>{const c={High:'bad',Medium:'warn',Low:'ok',Resolved:'ok',New:'acc',Verified:'ok','Self-reported':'warn','Pending verification':'acc',Approved:'ok',Pending:'warn',Declined:'bad','Info requested':'acc',Active:'ok',Completed:'acc',Paused:'warn'}[t]||'mut';return`<span class="pill ${c}">${esc(t)}</span>`};
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
const opts=(a,v)=>a.map((x,i)=>`<option value="${typeof x==='string'?esc(x):i}" ${(typeof x==='string'?x:i)==v?'selected':''}>${esc(typeof x==='string'?x:x.n||x)}</option>`).join('');
const coh=x=>COH[x.coh].n,prog=x=>PROG[COH[x.coh].p];
function login(r){role=r;view=NAV[r][0][0];render()}
function out(){role=null;bell=false;render()}
function go(v){view=v;bell=false;render()}
function resetDemo(){DB=init();save();toast('Demo data reset');render()}
function render(){const a=$('#app');if(!role){a.innerHTML=`<div class="login"><h1>TriumphED</h1><p class="mut" style="font-size:17px">From enrolment to achievement.</p><div class="demo">Demo mode: sample data for a fictional academy, saved only in this browser. No real sign-in or payments.</div><div class="g">${ROLES.map(r=>`<button class="card k" style="text-align:left;cursor:pointer" onclick="login('${r[0]}')"><b>${r[1]}</b><div class="mut">${r[2]}</div></button>`).join('')}</div><p class="mut">Try the full loop: student sends a support request → mentor creates a catch-up plan → student completes it → administrator sees the update.</p></div>`;return}
const nt=DB.notif.filter(n=>n.to===role),title=NAV[role].find(n=>n[0]===view);
a.innerHTML=`<aside><h1>TriumphED<small>Learning outcomes infrastructure</small></h1>${NAV[role].map(n=>`<button class="nv ${n[0]===view?'on':''}" onclick="go('${n[0]}')">${n[1]}<small>${n[2]}</small></button>`).join('')}</aside><main><div class="demo">Demo mode active · sample data · indicators are prompts for human support, never judgments of a student</div><header><h2>${title[1]}</h2>${pill(title[2])}<button class="btn o s" onclick="bell=!bell;render()" aria-label="Notifications">Alerts (${nt.length})</button><button class="btn o s" onclick="resetDemo()">Reset demo</button><button class="btn s" onclick="out()">Switch role</button></header>${bell?`<div class="card" style="margin-bottom:14px"><b>Notifications</b>${nt.map(n=>`<div class="mut">• ${esc(n.t)}</div>`).join('')||'<div class="mut">You’re all caught up.</div>'}</div>`:''}<div id="v">${V[view]()}</div></main>`;if(view==='students')lst();if(view==='out')olst()}
const V={};
V.dash=()=>{const s=me(),d=DB.mods.filter(Boolean).length,pl=DB.plans[s.id],nx=pl?pl.items.find(i=>!i.done):null;
return`<div class="g g2"><div class="card row" style="gap:20px"><svg width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="${s.prog}% complete"><circle cx="85" cy="85" r="70" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="85" cy="85" r="70" fill="none" stroke="var(--acc)" stroke-width="14" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="${440*(1-s.prog/100)}" transform="rotate(-90 85 85)" style="animation:ring 1.2s ease"/><text x="85" y="94" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">${s.prog}%</text></svg><div class="f"><h3 style="margin:0;font-family:Georgia,serif">Welcome back, Aarav</h3><div class="mut">${prog(s)} · 16 weeks · ${coh(s)}</div><div class="mut" style="margin-top:6px">Mentor: ${MEN[s.mentor]}</div><div class="mut">Sample data</div></div></div>
<div class="card"><div class="g" style="margin:0"><div><div class="big">${s.att}%</div><div class="mut">Attendance</div></div><div><div class="big">${d}/16</div><div class="mut">Modules</div></div><div><div class="big">${DB.asg}/10</div><div class="mut">Assignments</div></div><div><div class="big">3 Nov</div><div class="mut">Next assessment</div></div></div></div></div>
${pl?`<div class="card" style="border-color:var(--acc);margin-bottom:14px"><b>Your recovery plan is ready</b><div class="mut">${esc(pl.note)}</div>${bar(Math.round(pl.items.filter(i=>i.done).length/pl.items.length*100))}<button class="btn a s" style="margin-top:8px" onclick="go('recover')">Open plan</button></div>`:''}
<div class="card"><b>Your next best steps</b><div class="row" style="margin-top:8px"><button class="btn o" onclick="go('learn')">Complete Module ${DB.mods.indexOf(false)+1||16}</button><button class="btn o" onclick="go('learn')">Submit the pending project</button><button class="btn o" onclick="go('support')">Book your mentor session</button><button class="btn o" onclick="go('learn')">Review your assessment</button></div></div>`};
V.learn=()=>`<div class="card"><div class="row"><b class="f">Modules (${DB.mods.filter(Boolean).length}/16)</b><button class="btn a s" ${DB.asg>=10?'disabled':''} onclick="DB.asg++;log('Aarav Das submitted a project');save();toast('Project submitted for mentor review');render()">Submit pending project (${DB.asg}/10)</button></div>${MODS.map((m,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="f">${i+1}. ${m}</span>${DB.mods[i]?pill('Completed'):`<button class="btn s" onclick="modDone(${i})">Mark lesson complete</button>`}</div>`).join('')}</div>`;
function modDone(i){DB.mods[i]=true;me().prog=Math.floor(DB.mods.filter(Boolean).length/16*100);log('Aarav Das completed Module '+(i+1));save();confetti();toast('Milestone reached: Module '+(i+1));render()}
V.support=()=>{const s=me(),mine=DB.reqs.filter(r=>r.sid===s.id);return`<div class="g g2"><div class="card"><b>Ask for support</b><label for="cat">What are you facing?</label><select id="cat">${opts(['Academic difficulty','Time-management issues','Technical problems','Financial or personal interruption','Career guidance','Other'])}</select><label for="msg">Tell your mentor what is happening</label><textarea id="msg" rows="4" placeholder="A few sentences help your mentor prepare"></textarea><div id="err" class="mut" style="color:var(--bad)"></div><div class="row" style="margin-top:10px"><button class="btn a" onclick="sendReq()">Send request</button><button class="btn o" onclick="sendReq('Mentor meeting','I would like a mentor meeting.')">Request a mentor meeting</button></div></div><div class="card"><b>Your requests</b>${mine.map(r=>{const c=DB.cases.find(c=>c.id===r.cid);return`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${esc(r.cat)} ${pill(c.status)}<div class="mut">${r.date} · ${esc(r.msg)}</div></div>`}).join('')||'<p class="mut">No requests yet. Your mentor responds personally.</p>'}</div></div>`};
function sendReq(cat,msg){cat=cat||$('#cat').value;msg=msg||$('#msg').value.trim();if(msg.length<10){$('#err').textContent='Add at least 10 characters so your mentor understands.';return}
const s=me(),id='C-'+(++DB.cn);DB.cases.unshift({id,sid:s.id,reason:'Student request: '+cat,pri:'Medium',mentor:s.mentor,status:'New',notes:[],fu:''});DB.reqs.unshift({sid:s.id,cat,msg,date:T,cid:id});notify('mentor','New support request from Aarav Das: '+cat);notify('admin','Support case '+id+' opened');log('Aarav Das sent a support request ('+cat+')');save();toast('Request sent to '+MEN[s.mentor]);render()}
V.recover=()=>{const s=me(),ps=DB.pauses.filter(p=>p.sid===s.id),p=ps[0],pl=DB.plans[s.id],done=pl&&pl.items.every(i=>i.done),k=pl?(done?5:3):p?(p.status==='Approved'?2:1):0,st=['Pause request','Mentor review','Recovery plan','Resume programme','Complete pending milestones'];
return`<div class="card"><h3 style="margin:0;font-family:Georgia,serif">Pause. Recover. Continue.</h3><div class="mut">Falling behind should not mean dropping out.</div><div class="step">${st.map((x,i)=>`<span class="${i<k?'d':i===k?'c':''}">${x}</span>`).join('')}</div></div><div class="g g2" style="margin-top:14px"><div class="card"><b>Request a pause</b><label for="pr">Reason for the interruption</label><textarea id="pr" rows="3"></textarea><div id="err" style="color:var(--bad)" class="mut"></div><button class="btn a" style="margin-top:10px" onclick="pauseReq()">Submit pause request</button>${p?`<p>Latest request ${pill(p.status)}${p.resume?`<div class="mut">Proposed resume date: ${p.resume}</div>`:''}${p.why?`<div class="mut">Note from academy: ${esc(p.why)}</div>`:''}</p>`:''}</div>
<div class="card"><b>Catch-up plan</b>${pl?`<div class="mut">${esc(pl.note)}</div>${pl.items.map((i,x)=>`<div class="row" style="padding:7px 0"><input type="checkbox" style="width:auto" id="pi${x}" ${i.done?'checked disabled':''} onchange="planDone(${x})"><label for="pi${x}" style="margin:0;color:var(--ink)">${esc(i.t)}</label></div>`).join('')}`:`<p class="mut">No plan yet. After you send a support request or pause request, your mentor creates one with you.</p><div class="mut">Missed module: ${MODS[DB.mods.indexOf(false)]||'None'}</div>`}</div></div>`};
function pauseReq(){const r=$('#pr').value.trim();if(r.length<10){$('#err').textContent='Please explain the reason in at least 10 characters.';return}DB.pauses.unshift({id:'P-'+(DB.pauses.length+1),sid:'S-1001',reason:r,date:T,status:'Pending',resume:'',why:''});notify('admin','Pause request from Aarav Das');notify('mentor','Pause request from Aarav Das');log('Aarav Das requested a pause');save();toast('Sent for review by an authorised academy user');render()}
function planDone(i){const pl=DB.plans['S-1001'];pl.items[i].done=true;if(pl.items.every(x=>x.done)){const s=me();DB.mods[11]=true;s.prog=Math.floor(DB.mods.filter(Boolean).length/16*100);s.comp.push({n:'Secure authentication (catch-up plan)',v:'Pending verification'});const c=DB.cases.find(c=>c.sid===s.id&&c.status!=='Resolved');if(c)c.status='Follow-up required';notify('mentor','Aarav Das finished the catch-up plan. Please verify the competency.');notify('admin','Aarav Das is back on track: progress '+s.prog+'%');log('Aarav Das completed catch-up plan; progress now '+s.prog+'%');confetti();toast('Plan complete. Progress updated.')}save();render()}
V.career=()=>`<div class="g g2"><div class="card"><b>Job-search status</b><label for="cs">Where are you now?</label><select id="cs" onchange="DB.cs=this.value;save();toast('Status updated (self-reported)')">${opts(CS,DB.cs)}</select><p class="mut">TriumphED supports your career readiness. It does not guarantee employment.</p><b>Readiness</b><div class="mut">Resume</div>${bar(70)}<div class="mut">Interview preparation</div>${bar(40)}</div><div class="card"><b>Project portfolio</b>${DB.proj.map(p=>`<div style="padding:6px 0"><b>${esc(p.n)}</b><div class="mut">${esc(p.d)}</div></div>`).join('')}<label for="pn">Add a project</label><input id="pn" placeholder="Project name"><input id="pd" placeholder="What you built" style="margin-top:6px"><button class="btn a s" style="margin-top:8px" onclick="addProj()">Add project</button><div style="margin-top:12px"><b>Skills shown</b><div>${me().comp.map(c=>`${pill(c.v)} ${esc(c.n)}<br>`).join('')}</div></div></div></div>`;
function addProj(){const n=$('#pn').value.trim();if(!n){toast('Enter a project name');return}DB.proj.push({n,d:$('#pd').value.trim()||'No description'});save();render()}
V.cmd=()=>{const f=+UI.pf,S=DB.S.filter(x=>f<0||COH[x.coh].p===f),c=S.filter(x=>x.status==='Completed').length,act=S.length-c,pc=DB.cases.filter(x=>x.status!=='Resolved'&&S.some(s=>s.id===x.sid)).length,rv=S.filter(x=>x.status!=='Completed'&&(x.att<70||x.prog<40)).length,pr=DB.pauses.filter(p=>p.status==='Pending').length;
return`<div class="row"><label for="pf" style="margin:0">Programme</label><select id="pf" style="width:auto" onchange="UI.pf=this.value;render()"><option value="-1">All programmes</option>${PROG.map((p,i)=>`<option value="${i}" ${i===f?'selected':''}>${p}</option>`).join('')}</select><span class="mut">NorthEast Professional Academy</span></div><br>
<div class="g"><div class="card k" onclick="go('students')"><div class="big">${S.length}</div><div class="mut">Enrolled learners</div></div><div class="card k" onclick="go('students')"><div class="big">${act}</div><div class="mut">Active learners</div></div><div class="card k" onclick="go('students')"><div class="big">${c}</div><div class="mut">Completed</div></div><div class="card k"><div class="big">${(c/S.length*100).toFixed(1)}%</div><div class="mut">Completion rate (${c} of ${S.length})</div></div><div class="card k" onclick="go('cases')"><div class="big">${pc}</div><div class="mut">Pending support cases</div></div><div class="card k" onclick="go('students')"><div class="big">${rv}</div><div class="mut">Learners to review</div></div><div class="card k" onclick="go('rec')"><div class="big">${pr}</div><div class="mut">Pause requests pending</div></div></div>
<div class="g g2"><div class="card"><b>Cohort completion and average progress</b>${COH.map((h,i)=>{if(f>=0&&h.p!==f)return'';const a=DB.S.filter(x=>x.coh===i),cp=Math.round(a.filter(x=>x.status==='Completed').length/a.length*100),av=Math.round(a.reduce((t,x)=>t+x.prog,0)/a.length);return`<div style="margin-top:10px"><div class="row"><span class="f">${h.n}</span><span class="mut">${cp}% done · ${av}% avg progress</span></div>${bar(cp)}</div>`}).join('')}</div><div class="card"><b>Recent institutional activity</b>${DB.audit.slice(0,8).map(a=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">${esc(a.t)}<div class="mut">${a.d}</div></div>`).join('')}</div></div>`};
V.students=()=>`<div class="card"><div class="row"><input class="f" id="q" placeholder="Search name or ID" aria-label="Search" value="${esc(UI.q)}" oninput="UI.q=this.value;lst()"><select style="width:auto" aria-label="Programme" onchange="UI.prog=this.value;lst()"><option value="-1">All programmes</option>${PROG.map((p,i)=>`<option value="${i}" ${+UI.prog===i?'selected':''}>${p}</option>`).join('')}</select><select style="width:auto" aria-label="Status" onchange="UI.st=this.value;lst()">${['all','Active','Paused','Completed'].map(x=>`<option ${UI.st===x?'selected':''}>${x}</option>`).join('')}</select><select style="width:auto" aria-label="Sort" onchange="UI.sort=this.value;lst()">${[['name','Sort: name'],['prog','Sort: progress'],['att','Sort: attendance']].map(x=>`<option value="${x[0]}" ${UI.sort===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>${role==='admin'?'<button class="btn a" onclick="addStu()">Add demo student</button>':''}</div><div class="wrap" id="stl"></div></div>`;
function lst(){const e=$('#stl');if(!e)return;let a=DB.S.filter(x=>(role!=='mentor'||x.mentor===0)&&(+UI.prog<0||COH[x.coh].p===+UI.prog)&&(UI.st==='all'||x.status===UI.st)&&(x.name+x.id).toLowerCase().includes(UI.q.toLowerCase()));a.sort((x,y)=>UI.sort==='name'?x.name.localeCompare(y.name):y[UI.sort]-x[UI.sort]);
e.innerHTML=`<p class="mut">${a.length} learners</p><table><tr><th>Name</th><th>ID</th><th>Cohort</th><th>Attend.</th><th>Progress</th><th>Mentor</th><th>Status</th></tr>${a.slice(0,40).map(x=>`<tr class="k" tabindex="0" onclick="prof('${x.id}')" onkeydown="if(event.key==='Enter')prof('${x.id}')"><td>${esc(x.name)}</td><td>${x.id}</td><td>${coh(x)}</td><td>${x.att}%</td><td style="min-width:90px">${x.prog}%${bar(x.prog)}</td><td>${MEN[x.mentor]}</td><td>${pill(x.status)}</td></tr>`).join('')}</table>${a.length>40?'<p class="mut">Showing the first 40. Narrow with search or filters.</p>':a.length?'':'<p class="mut">No learners match. Clear a filter to see more.</p>'}`}
function prof(id){const x=sid(id),cs=DB.cases.filter(c=>c.sid===id),pl=DB.plans[id];modal(esc(x.name),`<div class="mut">${x.id} · ${prog(x)} · ${coh(x)} · Mentor ${MEN[x.mentor]}</div><p>${pill(x.status)} Progress ${x.prog}% · Attendance ${x.att}%</p>${bar(x.prog)}<b>Competencies</b><div>${x.comp.map((c,i)=>`${pill(c.v)} ${esc(c.n)} ${c.v==='Pending verification'&&role!=='student'?`<button class="btn s" onclick="verC('${id}',${i})">Verify</button>`:''}<br>`).join('')||'<span class="mut">None recorded yet</span>'}</div><b>Interventions</b><div>${cs.map(c=>`${pill(c.status)} ${esc(c.reason)}<br>`).join('')||'<span class="mut">No cases</span>'}</div>${pl?`<b>Catch-up plan</b><div>${pl.items.map(i=>`${i.done?'✔':'○'} ${esc(i.t)}`).join('<br>')}</div>`:''}`)}
function verC(id,i){sid(id).comp[i].v='Verified';log('Competency verified for '+sid(id).name);save();closeM();toast('Competency verified');render()}
function addStu(){modal('Add a demo student',`<label for="an">Full name</label><input id="an"><label for="ac">Cohort</label><select id="ac">${COH.map((c,i)=>`<option value="${i}">${c.n}</option>`).join('')}</select><div id="err" class="mut" style="color:var(--bad)"></div><button class="btn a" style="margin-top:10px" onclick="saveStu()">Add student</button>`)}
function saveStu(){const n=$('#an').value.trim();if(n.length<3){$('#err').textContent='Enter the learner’s full name.';return}DB.S.push({id:'S-'+(1300+DB.S.length),name:n,coh:+$('#ac').value,mentor:DB.S.length%5,prog:0,att:100,status:'Active',comp:[]});log('Added learner '+n);save();closeM();toast('Student added');render()}
V.cases=()=>{const L=DB.cases.filter(c=>role==='admin'||c.mentor===0).filter(c=>UI.cf==='all'||c.status===UI.cf);return`<div class="row"><label for="cf" style="margin:0">Show</label><select id="cf" style="width:auto" onchange="UI.cf=this.value;render()">${['all','New','Under review','Support initiated','Follow-up required','Resolved'].map(x=>`<option ${UI.cf===x?'selected':''}>${x}</option>`).join('')}</select><span class="mut">${L.length} cases. Flags are prompts for a human conversation.</span></div><br>${L.slice(0,25).map(c=>{const s=sid(c.sid);return`<div class="card" style="margin-bottom:12px"><div class="row"><b class="f"><a href="#" onclick="prof('${s.id}');return false">${esc(s.name)}</a> <span class="mut">${s.id} · ${s.prog}% · ${s.att}% attendance</span></b>${pill(c.pri)}${pill(c.status)}</div><div>${esc(c.reason)}</div><div class="row" style="margin-top:8px"><label class="mut" style="margin:0">Priority<select data-c="${c.id}" onchange="cset('${c.id}','pri',this.value)">${opts(['High','Medium','Low'],c.pri)}</select></label><label class="mut" style="margin:0">Status<select onchange="cset('${c.id}','status',this.value)">${opts(['New','Under review','Support initiated','Follow-up required','Resolved'],c.status)}</select></label>${role==='admin'?`<label class="mut" style="margin:0">Mentor<select onchange="cset('${c.id}','mentor',+this.value)">${opts(MEN,c.mentor)}</select></label>`:''}<label class="mut" style="margin:0">Follow-up<input type="date" value="${c.fu}" onchange="cset('${c.id}','fu',this.value)"></label></div>${c.notes.map(n=>`<div class="mut">📝 ${esc(n)}</div>`).join('')}<div class="row" style="margin-top:8px"><input class="f" id="n${c.id}" placeholder="Add a private note" aria-label="Note"><button class="btn s" onclick="addNote('${c.id}')">Add note</button><button class="btn a s" onclick="planM('${c.sid}')">Create catch-up plan</button><button class="btn o s" onclick="cset('${c.id}','status','Resolved')">Mark resolved</button></div></div>`}).join('')||'<div class="card">No cases here. Nothing needs attention.</div>'}`};
function cset(id,k,v){const c=DB.cases.find(c=>c.id===id);c[k]=v;log('Case '+id+': '+k+' set to '+(k==='mentor'?MEN[v]:v));if(k==='status'&&c.sid==='S-1001')notify('student','Your support request is now: '+v);save();toast('Case updated');render()}
function addNote(id){const v=$('#n'+id).value.trim();if(!v)return;DB.cases.find(c=>c.id===id).notes.push(v);save();render()}
function planM(id){modal('Catch-up plan for '+esc(sid(id).name),`<label for="pnn">Message to the student</label><input id="pnn" value="Let’s get you back on track together. Small steps, one week."><label for="pit">Milestones (one per line)</label><textarea id="pit" rows="4">Complete Module 12: Authentication &amp; Security\nSubmit the pending project\nAttend a mentor check-in</textarea><button class="btn a" style="margin-top:10px" onclick="savePlan('${id}')">Send plan to student</button>`)}
function savePlan(id){const it=$('#pit').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!it.length){toast('Add at least one milestone');return}DB.plans[id]={note:$('#pnn').value,items:it.map(t=>({t,done:false}))};DB.cases.filter(c=>c.sid===id&&c.status!=='Resolved').forEach(c=>c.status='Support initiated');if(id==='S-1001')notify('student','Your mentor created a catch-up plan for you');log('Catch-up plan created for '+sid(id).name);save();closeM();toast('Plan sent to student');render()}
V.rec=()=>`<div class="card wrap"><table><tr><th>Student</th><th>Programme</th><th>Reason</th><th>Date</th><th>Mentor</th><th>Status</th><th></th></tr>${DB.pauses.map((p,i)=>{const s=sid(p.sid);return`<tr><td>${esc(s.name)}</td><td>${prog(s)}</td><td>${esc(p.reason)}</td><td>${p.date}</td><td>${MEN[s.mentor]}</td><td>${pill(p.status)}${p.resume?`<div class="mut">Resume ${p.resume}</div>`:''}</td><td>${role==='admin'?`<div class="row"><button class="btn s" onclick="appr(${i})">Approve</button><button class="btn o s" onclick="pset(${i},'Info requested','Please share more detail')">More info</button><button class="btn o s" onclick="decl(${i})">Decline</button></div>`:''}<button class="btn a s" style="margin-top:4px" onclick="planM('${s.id}')">Create plan</button></td></tr>`}).join('')||'<tr><td>No requests.</td></tr>'}</table></div>`;
function pset(i,st,why,resume){const p=DB.pauses[i];Object.assign(p,{status:st,why:why||p.why,resume:resume||p.resume});if(st==='Approved')sid(p.sid).status='Paused';if(p.sid==='S-1001')notify('student','Pause request update: '+st);log('Pause '+p.id+': '+st);save();closeM();toast('Decision recorded');render()}
function appr(i){modal('Approve pause',`<label for="rd">Proposed resume date</label><input id="rd" type="date" value="2026-11-16"><button class="btn a" style="margin-top:10px" onclick="pset(${i},'Approved','Take care. We will review a recovery plan before you return.',$('#rd').value)">Approve pause</button>`)}
function decl(i){modal('Decline with explanation',`<label for="dw">Explanation shown to the student</label><textarea id="dw" rows="3"></textarea><div id="err" class="mut" style="color:var(--bad)"></div><button class="btn" style="margin-top:10px" onclick="$('#dw').value.trim()?pset(${i},'Declined',$('#dw').value.trim()):$('#err').textContent='An explanation is required.'">Record decision</button>`)}
V.ledger=()=>{const f=UI.cf==='all'?-1:+UI.cf,S=DB.S.filter(x=>f<0||x.coh===f),dn=S.filter(x=>x.status==='Completed'),O=dn.map(x=>DB.outs[x.id]),cnt=(a,k)=>VER.map(v=>a.filter(o=>(o[k]||'Unknown')===v).length),all=(n)=>[n,0,0,0],rows=[['Enrolment',all(S.length)],['Programme commencement',all(S.length)],['Module completion',[S.filter(x=>x.prog>=50).length,0,0,S.filter(x=>x.prog<50).length]],['Programme completion',all(dn.length)],['Competency verification',cnt(O,'cv')],['Career readiness',cnt(O,'rv')],['Employment follow-up',cnt(O,'v')]];
return`<div class="row"><label for="cf" style="margin:0">Cohort</label><select id="cf" style="width:auto" onchange="UI.cf=this.value;render()"><option value="all">All cohorts</option>${COH.map((c,i)=>`<option value="${i}" ${UI.cf==i&&UI.cf!=='all'?'selected':''}>${c.n}</option>`).join('')}</select><button class="btn a" onclick="csv()">Export CSV</button></div><br><div class="card wrap"><table><tr><th>Stage</th>${VER.map(v=>`<th>${v}</th>`).join('')}</tr>${rows.map(r=>`<tr><td>${r[0]}</td>${r[1].map(n=>`<td>${n}</td>`).join('')}</tr>`).join('')}</table><p class="mut">Aggregated counts only; no identifiable student records leave this screen. An unknown outcome is never treated as unemployment.</p></div>`};
function csv(){const t=[...document.querySelectorAll('#v tr')].map(r=>[...r.children].map(c=>c.textContent).join(',')).join('\n');modal('CSV report',`<p class="mut">Downloads are unavailable in this hosted preview. Copy the text below into a file.</p><textarea rows="9" id="cv">${esc(t)}</textarea><button class="btn a" style="margin-top:8px" onclick="$('#cv').select();document.execCommand('copy');toast('Copied')">Copy CSV</button>`)}
V.out=()=>`<div class="card"><b>Aarav Das</b> <span class="mut">self-reported status: ${esc(DB.cs)} ${pill('Self-reported')}</span></div><br><div class="card"><input id="oq" placeholder="Search completed learners" aria-label="Search" oninput="olst()" style="margin-bottom:10px"><div class="wrap" id="otl"></div></div>`;
function olst(){const e=$('#otl');if(!e)return;const q=($('#oq')||{value:''}).value.toLowerCase(),a=DB.S.filter(x=>x.status==='Completed'&&(x.name+x.id).toLowerCase().includes(q)).slice(0,15);
e.innerHTML=`<table><tr><th>Learner</th><th>Outcome</th><th>Verification</th><th>Employer / role</th><th>Follow-ups</th></tr>${a.map(x=>{const o=DB.outs[x.id];return`<tr><td>${esc(x.name)}<div class="mut">${prog(x)}</div></td><td><select aria-label="Outcome" onchange="oset('${x.id}','o',this.value)">${opts(OUT,o.o)}</select></td><td><select aria-label="Verification" onchange="oset('${x.id}','v',this.value)">${opts(VER,o.v)}</select></td><td><input aria-label="Employer and role" value="${esc(o.emp)}" placeholder="Where appropriate" onchange="oset('${x.id}','emp',this.value)"></td><td>${['90','180','360'].map(d=>`<button class="btn o s" onclick="oset('${x.id}','fu','${d}-day follow-up booked')">${d}d</button>`).join(' ')}<div class="mut">${esc(o.fu)}</div></td></tr>`}).join('')||'<tr><td>No matches.</td></tr>'}</table>`}
function oset(id,k,v){DB.outs[id][k]=v;log('Outcome record updated for '+sid(id).name);save();toast('Saved');if(k==='fu')olst()}
render();
</script></body></html>
